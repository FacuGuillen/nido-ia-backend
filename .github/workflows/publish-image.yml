name: Publish immutable image

on:
  push:
    branches:
      - dev-ia

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nido-ia

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable image reference
        run: |
          echo "IMAGE=${DOCKERHUB_IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Refuse to overwrite an existing tag
        run: |
          if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "Image tag ${IMAGE}:${TAG} already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Build production image
        run: docker build --tag "${IMAGE}:${TAG}" .

      - name: Tag stable channel
        run: docker tag "${IMAGE}:${TAG}" "${IMAGE}:recetas-ia-nido-v1"

      - name: Probe production container
        run: |
          docker run --detach --name nido-ia-probe \
            --publish 5000:5000 \
            --env APP_PORT=5000 \
            --env OPENAI_API_KEY=health-probe-only \
            --env OPENAI_MODEL=health-probe-only \
            "${IMAGE}:${TAG}"
          curl --fail --retry 12 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:5000/health/live

      - name: Stop probe container
        if: always()
        run: docker rm --force nido-ia-probe || true

      - name: Push immutable and stable channel tags
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:recetas-ia-nido-v1"
